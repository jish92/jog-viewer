<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jog Viewer</title>
<style>html,body{margin:0;height:100%;background:#c9ccd1;font-family:system-ui;overflow:hidden}#ui{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#fffc;padding:8px 14px;border-radius:12px;display:flex;gap:12px;align-items:center}#msg{position:fixed;top:12px;left:12px;color:#333}button{font-size:16px;padding:6px 12px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script></head>
<body><div id="msg">Loading…</div><div id="ui"><select id="ver"><option value="v7">v7 mocap</option><option value="v6" selected>v6 – arm contact physics</option><option value="v5">v5 – visible bounce</option><option value="v4">v4 – first jog</option></select><button id="pp">Pause</button><label>Speed <input id="sp" type="range" min="0.5" max="1" step="0.05" value="0.65"></label><span id="sv">0.65×</span><button id="rt">1×</button><button id="sm">Slow-mo</button></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xc9ccd1);s.fog=new THREE.Fog(0xc9ccd1,8,20);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.05,100);cam.position.set(2.2,1.3,3.4);
const oc=new OrbitControls(cam,r.domElement);oc.target.set(0,0.95,0);oc.enableDamping=true;oc.minDistance=1;oc.maxDistance=10;oc.update();
s.add(new THREE.HemisphereLight(0xffffff,0x8d8a85,1.6));const d=new THREE.DirectionalLight(0xffffff,1.8);d.position.set(3,6,4);d.castShadow=true;d.shadow.mapSize.set(2048,2048);d.shadow.radius=6;Object.assign(d.shadow.camera,{left:-2,right:2,top:3,bottom:-1});s.add(d);
const g=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0xb8bbbf,roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);
const L=new GLTFLoader();const D=new DRACOLoader();D.setDecoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/draco/');L.setDRACOLoader(D);
let mix,acts=[],cur=null;const clk=new THREE.Clock();window.jog={t:0,loaded:false,ver:null};
const msg=document.getElementById('msg');
function loadVer(v){window.jog.loaded=false;window.jog.ver=v;msg.textContent='Loading '+v+'…';
 if(cur){s.remove(cur);cur.traverse(o=>{if(o.isMesh){o.geometry.dispose()}});cur=null;mix=null;acts=[]}
 L.load('jog_'+v+'.glb',gl=>{if(window.jog.ver!==v)return;gl.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});cur=gl.scene;s.add(cur);window.jog.scene=cur;mix=new THREE.AnimationMixer(cur);
  acts=gl.animations.map(c=>{const a=mix.clipAction(c);a.setLoop(THREE.LoopRepeat);a.play();return a});
  window.jog.morph=gl.animations.some(c=>c.tracks.some(t=>t.name.includes('morphTargetInfluences')));
  msg.textContent=v+' · drag to orbit · scroll/pinch to zoom';window.jog.loaded=true},
  e=>{if(e.total)msg.textContent='Loading '+v+'… '+Math.round(100*e.loaded/e.total)+'%'},e=>{msg.textContent='Load error: '+e})}
const vs=document.getElementById('ver');vs.onchange=()=>loadVer(vs.value);loadVer(vs.value);
const pp=document.getElementById('pp'),sp=document.getElementById('sp'),sv=document.getElementById('sv');let paused=false;
document.getElementById("rt").onclick=()=>{sp.value=1;sp.oninput()};document.getElementById("sm").onclick=()=>{sp.value=0.65;sp.oninput()};pp.onclick=()=>{paused=!paused;pp.textContent=paused?'Play':'Pause'};sp.oninput=()=>{sv.textContent=(+sp.value).toFixed(2)+'×'};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
r.setAnimationLoop(()=>{const dt=clk.getDelta();if(mix&&!paused){mix.update(dt*sp.value);window.jog.t=acts.length?acts[0].time:0}oc.update();r.render(s,cam)});
</script><div style="position:fixed;bottom:4px;left:6px;font:11px sans-serif;color:#888">v7 motion: Bandai Namco Research Motiondataset-1, CC BY-NC 4.0 (retargeted, modified)</div></body></html>
